[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "khumbu"
version = "2.1.0"
description = "Classical one-dimensional numerical optimization methods, with tested implementations and full iterate histories"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "John Edisson Tapias Zarrazola" }]
keywords = ["optimization", "numerical-methods", "golden-section", "newton-raphson", "gradient-descent", "conjugate-gradient"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
figures = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/Kemquiros/khumbu"

[tool.hatch.build.targets.wheel]
packages = ["src/khumbu"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The 2017 coursework is preserved verbatim; linting it would mean changing it.
extend-exclude = ["legacy", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "D"]
ignore = [
  "D203",
  "D213",
  # The loop variable of every optimiser is read after the loop, as the
  # iteration count returned in the result. Ruff cannot see across the boundary.
  "B007",
  # Docstrings carry real mathematics: the minus sign U+2212 and Greek letters
  # are correct notation, not typos of ASCII lookalikes.
  "RUF002",
]

[tool.ruff.format]
# Recent ruff reformats Python blocks inside Markdown. The README aligns its
# inline comments on purpose -- that alignment is the readability -- so the
# prose is formatted by hand and checked by eye.
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
